# Which sensors run, and their settings. Cards on the dashboard follow this order.
#
# Every sensor needs:
#   id      short unique name; becomes the start of each point id (e.g. ambient.air_temp)
#   type    which adapter to use (see app/registry.py)
# Optional for every sensor:
#   label         name shown on the dashboard
#   enabled       false = shown as OFF, not started
#   poll_s        seconds between reads (default 1)
#   stale_after_s seconds without data before it shows STALE (default: the larger of 5 or 3 x poll_s)

site: rig1

sensors:
  - id: lepton
    type: lepton
    label: Thermal camera · Lepton 3.5
    device: auto          # finds the PureThermal by name; or a number, e.g. 0
    poll_s: 0.1
    scale: auto           # or a fixed range in degC, e.g. [20, 100]

  - id: mlx
    type: mlx90640
    label: Thermal camera · MLX90640
    refresh_hz: 4
    poll_s: 0.25
    smooth: true          # false shows the real 32x24 pixels
    scale: auto

  - id: tc08
    type: tc08
    label: Thermocouples · TC-08
    poll_s: 1             # each channel takes ~0.1 s to read, so 1 s suits up to ~8 channels
    mains_hz: 50          # UK mains
    channels:             # sockets with a probe plugged in -> probe type (printed on the plug, usually K)
      1: K                # readings appear as tc08.ch1, tc08.ch2, ...
      2: K                # labels (Water, Surface...) and positions are set per asset on the dashboard
      3: K
      4: K

  - id: ambient
    type: bme280
    label: Room air · BME280
    address: 0x77
    poll_s: 2

  - id: plug
    type: tapo_p110
    label: Smart plug · Tapo P110
    # The plug's IP goes in .env as TAPO_HOST (it changes on a phone hotspot, and .env
    # never clashes with git pull). A host: line here would override it.
    poll_s: 2

  - id: demo
    type: simulated
    label: Simulated sensor
    enabled: false        # set true to test the dashboard with no hardware
    image: true
    poll_s: 0.5
