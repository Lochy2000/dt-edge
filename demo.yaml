# No-hardware config: simulated sensors only, with the SAME ids as the real rig,
# so the kettle asset (probes tc08.ch1-4, plug, ambient, lepton) works unchanged.
#   laptop:  python -m app.main --config demo.yaml
#   Pi:      ./run.sh --config demo.yaml     (demo fallback if hardware misbehaves)
site: demo

sensors:
  - id: lepton
    type: simulated
    label: Simulated thermal camera
    image: true
    smooth: true
    poll_s: 0.5
    hfov_deg: 57          # for the Calibrate page (the simulated image is only 32 x 24)

  - id: mlx
    type: simulated
    label: Simulated thermal camera 2 (MLX)
    image: true
    smooth: true
    poll_s: 0.5

  - id: tc08
    type: simulated
    label: Simulated thermocouples
    channels: 8           # tc08.ch1 ... tc08.ch8
    poll_s: 1

  - id: plug
    type: simulated
    mode: plug            # ~2.9 kW load: 2 min on, 3 min off
    label: Simulated smart plug
    poll_s: 2

  - id: ambient
    type: simulated
    mode: ambient
    label: Simulated room air
    poll_s: 2
