# No-hardware config: runs only simulated sensors.
# Useful on a laptop:  python -m app.main --config demo.yaml
site: laptop

sensors:
  - id: sim_camera
    type: simulated
    label: Simulated thermal camera
    image: true
    smooth: true
    poll_s: 0.5

  - id: sim_tc
    type: simulated
    label: Simulated thermocouples
    channels: 4           # sim_tc.ch1 ... sim_tc.ch4
    poll_s: 1

  - id: plug
    type: tapo_p110
    label: Smart plug · Tapo P110
    enabled: false
